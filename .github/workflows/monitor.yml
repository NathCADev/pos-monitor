name: Monitor Pós-Graduação EAD

on:
  schedule:
    - cron: '0 11 * * 1'
    - cron: '0 14 * * 4'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  monitorar:
    name: Monitorar Novas Oportunidades
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Executar monitoramento
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
        run: |
          python scraper.py
      
      - name: Salvar histórico e resultados
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add historico.json resultados.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Atualizar dados"
          git push
        continue-on-error: true
      
      - name: Status da execução
        if: always()
        run: |
          echo "Monitoramento executado"
